# Aureon QA public ingress (spec-51).
#
# Installed to /etc/nginx/sites-available/aureon-qa and symlinked into
# sites-enabled. TLS blocks are added by certbot --nginx, which rewrites this
# file in place — re-copying it from the repo drops those, so re-run certbot
# afterwards (it is idempotent).
#
# WHY TWO HOSTNAMES
#   NEXT_PUBLIC_SUPABASE_URL is compiled into the browser bundle at build time.
#   The page and the Supabase API it calls must BOTH be reachable from the
#   visitor's browser, so a single frontend hostname is not enough — with
#   Supabase left on localhost the browser resolves it to the visitor's own
#   machine and login fails.
#
# DELIBERATELY NOT EXPOSED
#   Studio (8101) and Bull Board (3211) remain tunnel-only. They are
#   unauthenticated admin surfaces; see docs/qa-environment.md.
#
# No firewall change is involved — nginx already owns 80/443 for the other
# tractis.ai subdomains. UFW is never touched on this host.

server {
    listen 80;
    listen [::]:80;
    server_name qa.aureon.tractis.ai;

    # Publicly reachable, but not for public consumption.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name qa-api.aureon.tractis.ai;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Manifest signatures and OCR intake exceed nginx's 1m default.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Supabase Realtime is a websocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
