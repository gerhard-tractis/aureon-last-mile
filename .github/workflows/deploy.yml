name: Deploy Production

# Gated on CI. This workflow only starts after the "CI" workflow finishes for a
# push to main, and every job is conditioned on that run having SUCCEEDED — so a
# red build can never reach production. (Previously this triggered directly on
# push and raced CI, meaning failing tests still deployed.)
#
# Because the trigger is workflow_run, `github.sha` points at main's tip rather
# than the commit that was tested. Every checkout and VPS sync below pins
# `github.event.workflow_run.head_sha` explicitly, falling back to `github.sha`
# for a manual workflow_dispatch, where there is no workflow_run payload. Do
# not remove those refs.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual re-run. Exists because the path filters below can leave production
  # BEHIND the repo with no way to catch up: deploy-supabase only runs when a
  # push touched migrations/**, so a migration deploy that was skipped (or that
  # failed and was then buried under docs-only merges) stays unapplied until
  # some unrelated commit happens to touch that path. On 2026-08-23 production
  # was 13 migrations behind — including two spec-61 security fixes — and the
  # only ways to recover were an unrelated dummy commit or a hand-run
  # `supabase db push` outside the pipeline. Neither is acceptable, so the
  # pipeline can now be asked directly.
  #
  # This does NOT bypass anything: dispatching still runs deploy-qa, still
  # stops at approve-production for a human, and still ends at
  # verify-prod-migrations. It only changes which commit is deployed (the tip
  # of the branch you dispatch from) and, optionally, whether the migration
  # job's path filter is overridden.
  workflow_dispatch:
    inputs:
      force_db:
        description: 'Apply pending Supabase migrations even if this commit touched none'
        type: boolean
        default: false

# All deploy jobs run sequentially within their dependency chain — a failed
# migration never reaches app deploys. Jobs are gated on path filters so a
# CSS-only or docs-only push doesn't trigger DB or VPS work.
#
# EXECUTION ORDER (spec-57, gate scope narrowed by spec-92) — note this is NOT
# the order the jobs appear below; the blocks kept their original positions so
# the diff stayed reviewable:
#
#   changes  →  deploy-qa  →  e2e-qa  →  approve-production  →  deploy-supabase
#                                         (⏸ human only if              → deploy-edge-functions
#                                          auth_hook or pg_net           → deploy-vercel
#                                          touched)                     → deploy-worker/agents/solver
#
# Nothing touches production before `approve-production` (defined at the
# bottom of this file) passes — e2e-qa green, and this exact commit not
# superseded by a later merge. It pauses for a human ONLY when the diff
# touches the auth hook, or uses pg_net in a migration — the two classes of
# change deploy-qa + e2e-qa cannot vouch for (spec-92, spec-93).
# scripts/check-deploy-gating.mjs fails CI if any production job stops
# depending on it, or if either exemption inverts.
#
# CONCURRENCY LIVES ON THE JOBS, NOT HERE — do not "tidy" it back up to workflow
# level. A workflow-level group covers every job in the run, deploy-qa included,
# and a run paused at the gate keeps holding it. On 2026-08-16 the run for
# 9d2a0f3 sat pending with zero jobs started, behind a run waiting on approval:
# QA stopped tracking main because nobody had clicked a production button, which
# is precisely what deploy-qa's "QA is the backstop, so it always runs" comment
# rules out. One group per job keeps production serialised across runs, keeps
# worker/agents/solver parallel within a run, and leaves QA free of the gate.
# check-deploy-gating.sh enforces this shape.

env:
  # On workflow_run this is the commit CI actually tested. On workflow_dispatch
  # there is no workflow_run payload, so it falls back to github.sha — the tip
  # of the branch the dispatch was made from. Every checkout and VPS reset below
  # uses the same fallback; do not let the two forms drift apart.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ─── 0. Detect what changed ──────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    # Only deploy a green build of an actual push to main. workflow_run also
    # fires for pull_request CI runs and for the merge queue's merge_group
    # runs, neither of which must ever deploy. The queue's own merge into main
    # arrives separately as a push, and that is the one that ships.
    #
    # A manual dispatch is allowed through without those checks: there is no
    # workflow_run payload to inspect, and the human doing the dispatching is
    # the one deciding the commit is fit to ship. The production gate still
    # applies either way.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      edge_functions: ${{ steps.filter.outputs.edge_functions }}
      worker: ${{ steps.filter.outputs.worker }}
      agents: ${{ steps.filter.outputs.agents }}
      solver: ${{ steps.filter.outputs.solver }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # spec-92: the one class of change QA cannot exercise (see
      # approve-production below). Kept separate from `database` — most
      # migrations ARE covered by deploy-qa + e2e-qa; this is narrower.
      auth_hook: ${{ steps.filter.outputs.auth_hook }}
      # spec-92 fase 1b / spec-93: the second class QA cannot vouch for, and
      # in the dangerous direction — `pg_net` is installed in QA and NOT in
      # production (measured against run 34539233402 and QA live). A
      # migration calling net.http_post()/net.http_get() applies green
      # against QA and then fails in production with `schema "net" does not
      # exist`. Kept as its own output rather than folded into auth_hook: the
      # reason the gate paused is different and the runbook needs to say
      # which one it was (see "Record what is being approved" below).
      pg_net: ${{ steps.filter.outputs.pg_net }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the diff below needs the parent commit. A shallow
          # clone silently produced an empty diff for multi-commit pushes,
          # which skipped the migration job on pushes that did contain
          # migrations.
          fetch-depth: 0

      # spec-92 review (2026-09-09), B1 — auth_hook must NOT be scoped to this
      # single commit's diff. deploy-supabase (below) is unconditional and
      # runs `db push --include-all`, applying EVERY pending migration on
      # EVERY approved run — not just this commit's. A single-commit diff let
      # a hook migration slip through unpaused: PR A adds the migration and
      # correctly pauses; before anyone clicks, PR B (docs) merges with
      # auth_hook=false (B's own diff never touched the hook), auto-approves,
      # and B's `db push --include-all` applies A's still-pending migration —
      # nobody clicked anything. Identical via workflow_dispatch + force_db
      # (the 2026-08-23 incident: 13 migrations applied at once).
      #
      # Fix: scope the auth-hook check to the CUMULATIVE diff since the last
      # successfully completed Deploy Production run — because deploy-supabase
      # is unconditional, that run is guaranteed to have applied everything up
      # to its own commit, so anything since is exactly what THIS run's
      # `db push --include-all` would newly apply. Fails closed (pauses) if
      # the range cannot be established (see the step below).
      #
      # M1 — path names are an incidental signal (they only caught the hook
      # historically because OTHER co-modified files happened to name it).
      # The real signal is CONTENT: does the migration diff actually touch
      # the hook function, by any means — not only a fresh GRANT to
      # supabase_auth_admin (which has never once appeared in the repo's
      # migration history) but also a function hotfix (CREATE OR REPLACE),
      # whose GRANTs survive unchanged and so would never mention
      # supabase_auth_admin at all.
      #
      # M2 — the content check below captures into a variable BEFORE
      # grepping it, not piped straight into `grep -q`. `grep -q` exits at
      # the first match and closes its stdin; piped directly to a `git diff`
      # under `pipefail`, that SIGPIPEs git diff (rc 141) on any diff bigger
      # than one pipe buffer, and `set -e` then treats the whole pipeline as
      # failed — silently leaving the flag false even though the content
      # matched. Capturing via `$(...)` first means nothing reads git diff's
      # output until it has finished writing all of it, so there is no
      # reader to SIGPIPE it.
      - name: Filter paths
        id: filter
        env:
          FORCE_DB: ${{ inputs.force_db }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # main is squash-merge only, so HEAD^ is the previous main tip.
          BASE=$(git rev-parse "${DEPLOY_SHA}^")
          echo "Diffing ${BASE}..${DEPLOY_SHA}"
          CHANGED=$(git diff --name-only "${BASE}" "${DEPLOY_SHA}")
          echo "$CHANGED"

          matches() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          # force_db overrides the database path filter only. It exists so a
          # migration backlog can be applied without an unrelated commit that
          # happens to touch migrations/**; `supabase db push --include-all`
          # applies every pending migration, not just this commit's. Empty on
          # workflow_run, so this is a no-op there.
          DB=$(matches '^packages/database/supabase/(migrations/|seed\.sql|config\.toml)')
          if [ "${FORCE_DB}" = "true" ]; then
            echo "force_db: overriding database filter (was ${DB})"
            DB=true
          fi

          # B1 (see the step's YAML comment above): scope to the cumulative
          # diff since the last successful deploy, not this single commit.
          # Fails closed (pause) if that range cannot be established.
          RANGE_OK=false
          RANGE_BASE="${BASE}"
          LAST_SUCCESS_SHA="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
          if [ -n "${LAST_SUCCESS_SHA}" ] \
             && git cat-file -e "${LAST_SUCCESS_SHA}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "${LAST_SUCCESS_SHA}" "${DEPLOY_SHA}" 2>/dev/null; then
            RANGE_BASE="${LAST_SUCCESS_SHA}"
            RANGE_OK=true
            echo "auth_hook range: last successful deploy ${RANGE_BASE} .. ${DEPLOY_SHA}"
          else
            echo "auth_hook range: could not establish the last successful deploy — failing closed"
          fi

          # M1/M2 (see the step's YAML comment above): content signal,
          # captured into a variable before grepping. Capturing alone is NOT
          # enough to avoid SIGPIPE, though — see the review finding below —
          # the check against that variable must also avoid re-piping it.
          #
          # spec-92 fase 1b / spec-93 review (2026-09-10), B2 — `printf '%s'
          # "$VAR" | grep -qE ...` reintroduces the exact SIGPIPE this
          # comment claims to avoid: `grep -q` exits at the first match and
          # closes its stdin; under `pipefail`, if the match sits near the
          # START of a diff bigger than one pipe buffer (~64 KB) and printf
          # is still writing the rest, printf gets SIGPIPE, its exit code is
          # 141, and `pipefail` makes the WHOLE pipeline report 141 — which
          # the `if` reads as "did not match", silently producing false=false
          # even though the pattern was present. Reproduced on Ubuntu 22.04
          # (the runner's own OS): a 200 KB diff with the match on line one
          # gave pipeline rc=141 and PG_NET=false. This is the realistic
          # shape too — `git diff` orders by path, paths are migration
          # timestamps, so a pg_net migration merged first but left pending
          # behind later merges sorts EARLY in the cumulative diff, not
          # late. The fix is a herestring, not a pipe: `grep -qE ... <<<
          # "$VAR"` hands grep the data as a file descriptor with no writer
          # process on the other end of a pipe to SIGPIPE.
          AUTH_HOOK=false
          PG_NET=false
          if [ "${RANGE_OK}" != "true" ]; then
            AUTH_HOOK=true
            PG_NET=true
          else
            CUM_CHANGED="$(git diff --name-only "${RANGE_BASE}" "${DEPLOY_SHA}")"
            if echo "${CUM_CHANGED}" | grep -qE 'custom_access_token_hook|infra/supabase-qa/docker-compose\.yml|volumes/db/roles\.sql'; then
              AUTH_HOOK=true
            fi
            MIGRATIONS_DIFF="$(git diff "${RANGE_BASE}" "${DEPLOY_SHA}" -- packages/database/supabase/migrations/)"
            if grep -qE 'custom_access_token_hook|supabase_auth_admin' <<< "${MIGRATIONS_DIFF}"; then
              AUTH_HOOK=true
            fi
            # Case-insensitive (SQL identifiers are) and widened past the
            # two call forms — G1 (2026-09-10 review): net.http_post/get are
            # not the only surface. net.http_delete exists since pg_net
            # 0.7, a schema-qualified call (extensions.net.http_post) or a
            # bare `PERFORM net.http_get` both still match this, and so does
            # whitespace around the dot (`net . http_post`, legal SQL) via
            # \s*. A bare `pg_net` or `SCHEMA net` mention (an install/grant,
            # not just a call) also counts — a false negative here ships a
            # migration production cannot apply at all; the cost of a false
            # positive is one click.
            if grep -qiE 'net\s*\.\s*http|pg_net\b|schema\s+net\b' <<< "${MIGRATIONS_DIFF}"; then
              PG_NET=true
            fi
          fi

          {
            echo "database=${DB}"
            echo "edge_functions=$(matches '^packages/database/supabase/functions/')"
            echo "worker=$(matches '^apps/worker/')"
            echo "agents=$(matches '^apps/agents/')"
            echo "solver=$(matches '^sidecar/or-tools/')"
            echo "frontend=$(matches '^apps/frontend/')"
            echo "auth_hook=${AUTH_HOOK}"
            echo "pg_net=${PG_NET}"
          } >> "$GITHUB_OUTPUT"

  # ─── 1. Database Migrations ──────────────────────────────────────────────────
  deploy-supabase:
    name: Deploy Supabase Migrations
    # One group per production job: two approved runs never mutate the same
    # target at once, while worker/agents/solver still run in parallel within a
    # run and deploy-qa is not blocked by a pending approval. See the header.
    concurrency:
      group: production-deploy-supabase
      cancel-in-progress: false
    needs: [approve-production]
    # DELIBERATELY NOT PATH-FILTERED, for the same reason verify-prod-migrations
    # is not: the path filter WAS the drift bug.
    #
    # This used to also require `needs.changes.outputs.database == 'true'`, i.e.
    # "the push that triggered this run touched migrations". That reads the
    # wrong thing. Whether production needs migrations is a fact about
    # PRODUCTION, not about the diff of whichever commit happens to arrive at
    # the gate — and the two come apart constantly, because the gate is human
    # and the merge stream is not. A migration merges, its run waits for
    # approval, four docs-only merges land behind it, and the run someone
    # finally approves is a docs commit whose diff touches no migration. The
    # job skips, `verify-prod-migrations` goes red, and nobody is deploying
    # anything wrong — the deploy simply never happens. Production sat 13
    # migrations and 5 days behind exactly this way (2026-08-17 → 2026-08-22).
    #
    # Running unconditionally is safe and cheap: `supabase db push
    # --include-all` applies only what is pending and is a no-op otherwise, so
    # the cost on a docs deploy is one link plus one empty push. The gate still
    # governs WHETHER we deploy; it just no longer also has to guess WHAT is
    # pending.
    #
    # The explicit result check matters here: unlike the app jobs below, this
    # `if:` has no `always()`, so it must state outright that a gate which did
    # not succeed stops the migration.
    if: needs.approve-production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Must be a version that recognises Postgres 17 in config.toml's
          # db.major_version. The earlier 2.20.x pin rejected major_version=17
          # with "Failed reading config: Invalid db.major_version: 17", which
          # silently broke production migration deploys for every PR that
          # touched packages/database/supabase/migrations/** (the path filter
          # only triggers this job on actual migration changes, so the bug
          # went undetected until PR #214 — the first migration since the
          # PG17 bump — failed in 16s at the link step).
          version: 2.88.1

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run migrations
        # --include-all is required because the repo has a backlog of migrations
        # whose timestamps are earlier than the last migration on remote (this
        # happens when migrations are merged out of order, e.g. PR A merges
        # 20260409000008 while PR B already merged 20260415000001). Without
        # --include-all, Supabase CLI 2.88.1 refuses to apply older pending
        # migrations and exits 1, blocking every subsequent DB deploy.
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ─── 1b. Production migration drift gate ─────────────────────────────────────
  verify-prod-migrations:
    name: Verify Production Migrations
    needs: [changes, deploy-supabase]
    # DELIBERATELY NOT PATH-FILTERED — the path filter is the bug this catches.
    #
    # deploy-supabase only runs when migrations/** changes, so a broken migration
    # deploy stays latent until the next migration lands (see the CLI-pin comment
    # above, and REMEDIATION.md M1). QA (spec-48) replays the full ledger every
    # merge and so is always correct; production had no equivalent check. This
    # runs on every green push regardless of what changed.
    #
    # Runs even when deploy-supabase failed: the ledger comparison tells us what
    # production's schema actually is, which is the useful thing to know then.
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep in lockstep with deploy-supabase above.
          version: 2.88.1

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Compare production ledger against the repo
        # Parsing lives in a script so it is unit-testable without credentials —
        # see scripts/verify-prod-migrations.test.sh
        run: |
          set -euo pipefail
          supabase migration list --linked \
            | bash "$GITHUB_WORKSPACE/scripts/verify-prod-migrations.sh"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ─── 2. Edge Functions ───────────────────────────────────────────────────────
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    concurrency:
      group: production-deploy-edge-functions
      cancel-in-progress: false
    needs: [changes, approve-production, deploy-supabase]
    if: |
      always() &&
      needs.approve-production.result == 'success' &&
      needs.changes.outputs.edge_functions == 'true' &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # See the version note in deploy-supabase above.
          version: 2.88.1

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── 3. Frontend (Vercel) ────────────────────────────────────────────────────
  # This job is the ONLY thing that should deploy the frontend to production.
  # It runs on every green push to main and is ordered after migrations, so app
  # code never reaches users ahead of the schema it depends on.
  #
  # REQUIRED: Vercel's Git integration must have production auto-deploy DISABLED
  # for `main` (Vercel → Project → Settings → Git → Ignored Build Step, or
  # `git.deploymentEnabled`). While it is enabled, Vercel ships every push
  # outside GitHub Actions and this ordering guarantee is void — a failed
  # migration would still be followed by a frontend deploy against the old
  # schema, with no rollback.
  deploy-vercel:
    name: Deploy to Vercel
    concurrency:
      group: production-deploy-vercel
      cancel-in-progress: false
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() && !failure() && !cancelled() &&
      needs.approve-production.result == 'success' &&
      needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Vercel
        run: npx vercel@latest --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Rollback on failure
        if: failure()
        run: |
          npx vercel@latest rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo "::error::Vercel deployment failed — rolled back to previous version"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 4. Worker (VPS) ─────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker to VPS
    concurrency:
      group: production-deploy-worker
      cancel-in-progress: false
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() && !failure() && !cancelled() &&
      needs.approve-production.result == 'success' &&
      needs.changes.outputs.worker == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - name: Sync repo to the tested commit
        run: |
          set -euo pipefail
          cd ~/aureon-last-mile
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard "${DEPLOY_SHA}"
          # Don't leave the token sitting in .git/config on the VPS.
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy worker
        run: bash ~/aureon-last-mile/apps/worker/scripts/deploy.sh

      - name: Report failure
        if: failure()
        run: |
          echo "::error::VPS worker deployment failed."
          echo "To debug: sudo journalctl -u aureon-worker -n 50"

  # ─── 5. Agents Suite (VPS) ───────────────────────────────────────────────────
  deploy-agents:
    name: Deploy Agents to VPS
    concurrency:
      group: production-deploy-agents
      cancel-in-progress: false
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() && !failure() && !cancelled() &&
      needs.approve-production.result == 'success' &&
      needs.changes.outputs.agents == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - name: Sync repo to the tested commit
        run: |
          set -euo pipefail
          cd ~/aureon-last-mile
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard "${DEPLOY_SHA}"
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy agents
        run: bash ~/aureon-last-mile/apps/agents/scripts/deploy.sh

      - name: Report failure
        if: failure()
        run: |
          echo "::error::VPS agents deployment failed."
          echo "To debug: sudo journalctl -u aureon-agents -n 50"

  # ─── 6. OR-Tools Solver Sidecar (VPS) ────────────────────────────────────────
  deploy-solver:
    name: Deploy OR-Tools Solver to VPS
    concurrency:
      group: production-deploy-solver
      cancel-in-progress: false
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() && !failure() && !cancelled() &&
      needs.approve-production.result == 'success' &&
      needs.changes.outputs.solver == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - name: Sync repo to the tested commit
        run: |
          set -euo pipefail
          cd ~/sidecar
          git fetch origin main
          git reset --hard "${DEPLOY_SHA}"

      - name: Install dependencies and restart
        run: |
          set -euo pipefail
          cd ~/sidecar/sidecar/or-tools
          source ~/.venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          sudo cp aureon-solver.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl restart aureon-solver
          sleep 2
          curl -sf http://127.0.0.1:8090/api/v1/health

      - name: Report failure
        if: failure()
        run: |
          echo "::error::OR-Tools solver deployment failed."
          echo "To debug: sudo journalctl -u aureon-solver -n 50"

  # ─── 7. QA Environment (VPS) ─────────────────────────────────────────────────
  # Keeps the self-hosted QA env (spec-48) in sync with every green main merge.
  #
  # Deliberately NOT path-filtered on migrations: the QA script replays the
  # full migration ledger on every run (idempotent), so QA can never silently
  # drift behind the prod schema. A path filter here previously masked DB
  # failures in prod (green checks while the DB job was skipped) — QA is the
  # backstop, so it always runs. App rebuilds ARE filtered via CHANGED_* flags.
  #
  # CHANGED IN spec-57: this job is now production's precondition, not a
  # parallel mirror. `approve-production` requires it to succeed, and every
  # production job requires `approve-production` — so a QA sync failure DOES
  # block production now. That is deliberate: QA replaying the full migration
  # ledger is the only automated check that a merge's schema actually applies.
  #
  # Tradeoff accepted knowingly: a QA VPS outage blocks production deploys.
  # The escape hatch is docs/runbooks/manual-deployment.md — not editing this
  # dependency out.
  deploy-qa:
    name: Sync QA Environment
    # QA's own group, unrelated to production: two syncs at once would race on
    # the same checkout and build directory on the VPS, but a run waiting at the
    # production gate must never hold this one.
    concurrency:
      group: qa-deploy
      cancel-in-progress: false
    needs: [changes]
    # Gate ONLY on this job's own dependency.
    #
    # This used to read `always() && !failure() && !cancelled() && …`. At job
    # level those functions are evaluated against the workflow as a whole, not
    # against `needs:` — so ANY failing job anywhere in the run took QA down
    # with it. In practice `verify-production-migrations` failed (production is
    # behind on migrations because production deploys wait at the approval
    # gate), and QA stopped syncing entirely: two consecutive merges reported
    # `Sync QA Environment: cancelled` and skipped the E2E.
    #
    # That inverts everything the block above says. QA has its own concurrency
    # group precisely so "a run waiting at the production gate must never hold
    # this one", and spec-57 made QA production's *precondition* — so a
    # production-side check must never be able to block QA. Otherwise a
    # production problem blocks the very environment used to qualify the fix
    # for it, and the only way out is deploying to production unqualified.
    if: always() && needs.changes.result == 'success'
    runs-on: [self-hosted, vps]
    timeout-minutes: 15
    steps:
      # The QA checkout self-syncs inside the script, but the script FILE must
      # come from the tested commit — so put DEPLOY_SHA in a scratch clone and
      # run it from there.
      #
      # Plain git, NOT actions/checkout, matching the worker/agents/solver jobs
      # above. actions/checkout has to download itself from codeload.github.com,
      # and this VPS's IP is rate-limited there: on 2026-08-17 two consecutive
      # QA syncs died at "Set up job" with 502 then 429 before a single step
      # ran, leaving QA stale with a green-looking merge. git talks to a
      # different endpoint and the runner already has it.
      - name: Sync repo to the tested commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Its own scratch clone, not the ~/aureon-last-mile the production VPS
          # jobs share: those reset that directory to THEIR run's DEPLOY_SHA, and
          # deploy-qa is deliberately in a different concurrency group, so the two
          # can run at once and would fight over it.
          WORKDIR="$HOME/qa-deploy-src"
          [ -d "$WORKDIR/.git" ] || git init -q "$WORKDIR"
          cd "$WORKDIR"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Shallow fetch of the one commit; fall back to main's history if the
          # server refuses a bare SHA.
          git fetch -q --depth 1 origin "${DEPLOY_SHA}" || git fetch -q origin main
          git reset -q --hard "${DEPLOY_SHA}"
          # Don't leave the token sitting in .git/config on the VPS.
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Sync QA environment
        run: |
          set -euo pipefail
          cd "$HOME/qa-deploy-src"
          bash infra/supabase-qa/deploy-qa.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGED_WORKER: ${{ needs.changes.outputs.worker }}
          CHANGED_AGENTS: ${{ needs.changes.outputs.agents }}
          CHANGED_EDGE_FUNCTIONS: ${{ needs.changes.outputs.edge_functions }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::QA environment sync failed — QA is now drifted from main."
          echo "To debug: run infra/supabase-qa/deploy-qa.sh on the VPS, or check"
          echo "journalctl -u aureon-frontend-qa/-agents-qa/-worker-qa -n 50."
          echo "NOTE: this now blocks the production deploy (spec-57)."

  # ─── 7b. End-to-end tests against QA ─────────────────────────────────────────
  # Drives the real screens in the QA environment with Playwright, on the commit
  # QA was just synced to (spec-57 phase 2).
  #
  # BLOCKING. `approve-production` lists this job in its `needs:` and asserts
  # its result, and scripts/check-deploy-gating.mjs fails CI if either wiring is
  # removed. A red E2E against QA stops the production deploy.
  #
  # It was advisory until 2026-09-03 (continue-on-error + absent from the gate)
  # while its flakiness and runtime were unknown. If it starts failing for
  # reasons that are not the code — QA seed drift, VPS flakiness — fix the cause
  # or quarantine the individual test. Do NOT restore continue-on-error: a suite
  # that cannot veto is telemetry, not a gate, and the guard will fail CI anyway.
  #
  # Must run on the VPS: every QA port binds to localhost there.
  e2e-qa:
    name: E2E against QA
    # Shares deploy-qa's group (#428): this job seeds and tears down rows in the
    # QA database, so it must never overlap another run's QA sync rebuilding
    # that same environment underneath it — nor a second E2E run seeding the
    # same labels. Within a run the two are already sequential via `needs:`;
    # this serialises them ACROSS runs. Deliberately NOT a production group —
    # QA work must stay free of the approval gate.
    concurrency:
      group: qa-deploy
      cancel-in-progress: false
    needs: [changes, deploy-qa]
    if: always() && !failure() && !cancelled() && needs.deploy-qa.result == 'success'
    runs-on: [self-hosted, vps]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Same guard as deploy-qa.sh: a host without QA provisioned must skip
      # rather than fail, so this job never invents a reason to look red.
      - name: Check QA is provisioned
        id: qa
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f /home/aureon/.env.qa ]; then
            echo "QA env file missing — skipping E2E"
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.qa.outputs.provisioned == 'true'
        working-directory: .
        run: npm ci

      # Idempotent and cached in ~/.cache/ms-playwright. Deliberately without
      # --with-deps: that needs root, and this job must not require passwordless
      # sudo. If Chromium's system libraries are missing, run once on the VPS:
      #   sudo npx playwright install-deps chromium
      - name: Install Chromium
        if: steps.qa.outputs.provisioned == 'true'
        run: npx playwright install chromium

      - name: Run E2E against QA
        if: steps.qa.outputs.provisioned == 'true'
        run: |
          set -euo pipefail
          # spec-87 fase 1 fix round 3 — if npm run e2e:qa dies before
          # Playwright even starts (a bad export above, a missing dep), no new
          # results.json is written and "Check quarantine" below would read
          # whatever a PREVIOUS run left behind, on this same self-hosted
          # runner, and pass on stale data. actions/checkout@v4's implicit
          # clean: true does not save this — it does not touch untracked
          # output directories outside the checkout's own git-ignored state
          # reliably enough to be the thing anyone is relying on here, and
          # nobody had written down that they were relying on it at all.
          rm -rf playwright-report-qa
          PGPASS="$(grep -E '^POSTGRES_PASSWORD=' /home/aureon/.env.qa | tail -n1 | cut -d= -f2- | tr -d '\r')"
          [ -n "$PGPASS" ] || { echo "::error::POSTGRES_PASSWORD missing from /home/aureon/.env.qa"; exit 1; }
          export E2E_DATABASE_URL="postgresql://postgres:${PGPASS}@localhost:5433/postgres"
          export E2E_BASE_URL="http://localhost:3200"
          # spec-77/79 Fase 5 — despacho-close-dispatch.spec.ts dispatches
          # routes for real, against this QA-only mock, never the real DT
          # tenant (infra/supabase-qa/dispatchtrack-mock/'s own header).
          # Fail fast with a clear message rather than a mysterious dispatch
          # timeout if it is not running.
          curl -sf http://127.0.0.1:4477/__test__/health > /dev/null \
            || echo "::warning::DispatchTrack mock (127.0.0.1:4477) is not reachable — despacho-close-dispatch.spec.ts will fail"
          # spec-87 fase 1 — this step must not fail the job on a raw red
          # suite: whether that is allowed through is decided by the
          # "Check quarantine" step below, which reads the JSON report this
          # produces. `|| true` here is NOT continue-on-error (that swallows
          # the result at the job level and disappears silently) — the suite
          # still vetoes production, just one step later, against the
          # quarantine list rather than against a bare exit code.
          npm run e2e:qa || true

      - name: Check quarantine
        if: steps.qa.outputs.provisioned == 'true'
        working-directory: .
        run: |
          bash scripts/check-quarantine.sh \
            apps/frontend/e2e/quarantine.json \
            apps/frontend/playwright-report-qa/results.json

      - name: Upload report
        if: always() && steps.qa.outputs.provisioned == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-qa-report-${{ github.event.workflow_run.head_sha || github.sha }}
          path: apps/frontend/playwright-report-qa/
          retention-days: 14
          if-no-files-found: ignore

      # Runs only if an earlier step in this job actually failed — meaning an
      # undeclared failure, an expired quarantine entry, or a stale one
      # (spec-87 fase 1), never a raw red exit code from npm run e2e:qa
      # (which no longer fails the job on its own — see "Run E2E against QA"
      # above). approve-production requires needs.e2e-qa.result == 'success'
      # (enforced by check-deploy-gating.mjs), so this DOES block the
      # production deploy — false to say otherwise, which an earlier draft
      # of this step's own echo output did until 2026-09-03.
      - name: Report failure
        if: failure()
        run: |
          echo "::error::E2E against QA failed on ${DEPLOY_SHA}."
          echo "Download the 'e2e-qa-report-*' artifact for traces and video."

  # ─── 8. Production approval gate ─────────────────────────────────────────────
  # The single checkpoint between a green merge and production.
  #
  # Despite sitting last in this file, it runs SECOND — right after deploy-qa.
  # Every job that mutates production depends on it, and it depends on
  # deploy-qa and e2e-qa, so production is reachable only after QA has been
  # synced to this commit AND the E2E suite against QA passed.
  #
  # CHANGED IN spec-92: this pauses for a human click ONLY when the diff
  # touches the auth hook (`needs.changes.outputs.auth_hook`) OR a migration
  # uses pg_net (`needs.changes.outputs.pg_net`, spec-92 fase 1b / spec-93).
  # Every other merge auto-approves. It used to pause unconditionally,
  # carrying `environment: production` with a required-reviewer rule for
  # every merge (spec-57). That rule protected against exactly what
  # needs.e2e-qa.result == 'success' below already protects against — the
  # human approving was reading the same signal this `if:` reads, because
  # e2e-qa did not exist when spec-57 wrote the click, and by the time it
  # did, nothing was left for a human to add for most changes: deploy-qa
  # already applies every migration to QA, and e2e-qa already runs against
  # that applied migration, before this job is even reachable. Four runs sat
  # unapproved for hours in one session because the click had nothing left
  # to verify that the pipeline didn't already verify — see
  # docs/specs/spec-92-gate-produccion-diferenciado.md.
  #
  # The first class of change exempt from that argument: the auth hook.
  # QA's GoTrue never invokes custom_access_token_hook at all (no
  # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_* in infra/supabase-qa/docker-compose.yml),
  # and even where the hook fails gracefully by design (`EXCEPTION WHEN
  # OTHERS THEN RAISE WARNING …; RETURN event;`), e2e-qa's signIn() never
  # reads the JWT — a degraded hook still produces a green login. deploy-qa +
  # e2e-qa passing proves NOTHING about this class of change, so it must not
  # auto-approve. `changes.outputs.auth_hook` (spec-92) is the detector.
  #
  # The second class, added by spec-93's full QA↔production inventory: a
  # migration calling net.http_post()/net.http_get(). `pg_net` is installed
  # in QA and NOT in production (measured — production's extension list has
  # no pg_net; QA's does, 0.20.3). Unlike the auth hook, this is not "QA
  # can't exercise the behaviour" but "QA applies the migration successfully
  # and production CANNOT apply it at all" (`schema "net" does not exist`) —
  # deploy-qa + e2e-qa passing is not just uninformative here, it is
  # actively misleading. `changes.outputs.pg_net` is the detector. See
  # docs/specs/spec-93-paridad-qa-produccion.md for the rest of the
  # inventory and for closing this class of gap at the root instead of one
  # exception at a time.
  #
  # `environment:` resolves via expression (needs context is supported there)
  # to `production` (the required-reviewer environment from spec-57,
  # unchanged) when EITHER auth_hook or pg_net is true, or to
  # `production-auto` (no protection rules — GitHub creates it automatically
  # on first reference) only when both are false.
  # `changes` failing degrades the chain to a skip before this job is even
  # reached (deploy-qa's own `if:` requires needs.changes.result == 'success',
  # and this job requires needs.deploy-qa.result == 'success'), so a failure
  # to determine auth_hook can never fall through to the unprotected side.
  #
  # What ALSO replaces the unconditional click is the "Verify this run is
  # current" step below: a run superseded by a newer merge must not deploy
  # stale code on top of it (the risk spec-57 flagged and never closed). It
  # runs on both paths, including AFTER a human approval on the auth_hook
  # path — so an approval granted late, after a newer merge landed, still
  # does not ship stale code. scripts/check-deploy-gating.mjs asserts the
  # step exists, is not swallowed by continue-on-error or `|| true`, that
  # needs.e2e-qa.result == 'success' is still required, and that the
  # environment expression cannot invert (auth_hook mapping to the
  # unprotected side). Do not remove any of those checks.
  #
  # ONE job gates production on purpose — every prod job depends on this one,
  # not on e2e-qa/deploy-qa directly, so there is exactly one place this logic
  # lives.
  approve-production:
    name: Approve Production Deploy
    needs: [changes, deploy-qa, e2e-qa]
    if: |
      always() && !failure() && !cancelled()
      && needs.deploy-qa.result == 'success'
      && needs.e2e-qa.result == 'success'
    environment: ${{ (needs.changes.outputs.auth_hook == 'true' || needs.changes.outputs.pg_net == 'true') && 'production' || 'production-auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fails closed on purpose: no `|| true`, no continue-on-error. A run
      # whose commit is no longer main's tip lost the race against a later
      # merge and must not deploy — and if this can't even be determined (the
      # API call itself fails), that is also not a green light.
      - name: Verify this run is current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
          echo "main is at: ${MAIN_SHA}"
          echo "this run:   ${DEPLOY_SHA}"
          if [ "${MAIN_SHA}" != "${DEPLOY_SHA}" ]; then
            echo "::error::This run (${DEPLOY_SHA}) is no longer main's tip (${MAIN_SHA}) — a later merge already superseded it. Not deploying stale code."
            exit 1
          fi

      - name: Record what is being approved
        run: |
          echo "Deploying to production: ${DEPLOY_SHA}"
          echo "QA sync result: ${{ needs.deploy-qa.result }}"
          echo "E2E against QA: ${{ needs.e2e-qa.result }}"
          echo "Auth hook touched: ${{ needs.changes.outputs.auth_hook }}"
          echo "pg_net used in a migration: ${{ needs.changes.outputs.pg_net }}"
          echo "Runbook: docs/runbooks/approve-production-deploy.md"
