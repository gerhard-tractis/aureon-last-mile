name: Deploy Production

# Gated on CI. This workflow only starts after the "CI" workflow finishes for a
# push to main, and every job is conditioned on that run having SUCCEEDED — so a
# red build can never reach production. (Previously this triggered directly on
# push and raced CI, meaning failing tests still deployed.)
#
# Because the trigger is workflow_run, `github.sha` points at main's tip rather
# than the commit that was tested. Every checkout and VPS sync below pins
# `github.event.workflow_run.head_sha` explicitly. Do not remove those refs.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# All deploy jobs run sequentially within their dependency chain — a failed
# migration never reaches app deploys. Jobs are gated on path filters so a
# CSS-only or docs-only push doesn't trigger DB or VPS work.
#
# EXECUTION ORDER (spec-57) — note this is NOT the order the jobs appear below;
# the blocks kept their original positions so the diff stayed reviewable:
#
#   changes  →  deploy-qa  →  approve-production ⏸  →  deploy-supabase
#                                (human)               →  deploy-edge-functions
#                                                      →  deploy-vercel
#                                                      →  deploy-worker/agents/solver
#
# Nothing touches production before a human approves `approve-production`
# (defined at the bottom of this file). scripts/check-deploy-gating.sh fails CI
# if any production job stops depending on it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  # ─── 0. Detect what changed ──────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    # Only deploy a green build of an actual push to main. workflow_run also
    # fires for pull_request CI runs, which must never deploy.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      edge_functions: ${{ steps.filter.outputs.edge_functions }}
      worker: ${{ steps.filter.outputs.worker }}
      agents: ${{ steps.filter.outputs.agents }}
      solver: ${{ steps.filter.outputs.solver }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history: the diff below needs the parent commit. A shallow
          # clone silently produced an empty diff for multi-commit pushes,
          # which skipped the migration job on pushes that did contain
          # migrations.
          fetch-depth: 0

      - name: Filter paths
        id: filter
        run: |
          set -euo pipefail
          # main is squash-merge only, so HEAD^ is the previous main tip.
          BASE=$(git rev-parse "${DEPLOY_SHA}^")
          echo "Diffing ${BASE}..${DEPLOY_SHA}"
          CHANGED=$(git diff --name-only "${BASE}" "${DEPLOY_SHA}")
          echo "$CHANGED"

          matches() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          {
            echo "database=$(matches '^packages/database/supabase/(migrations/|seed\.sql|config\.toml)')"
            echo "edge_functions=$(matches '^packages/database/supabase/functions/')"
            echo "worker=$(matches '^apps/worker/')"
            echo "agents=$(matches '^apps/agents/')"
            echo "solver=$(matches '^sidecar/or-tools/')"
            echo "frontend=$(matches '^apps/frontend/')"
          } >> "$GITHUB_OUTPUT"

  # ─── 1. Database Migrations ──────────────────────────────────────────────────
  deploy-supabase:
    name: Deploy Supabase Migrations
    needs: [changes, approve-production]
    # The explicit result check matters here: unlike the app jobs below, this
    # `if:` has no `always()`, so it must state outright that a gate which did
    # not succeed stops the migration.
    if: |
      needs.approve-production.result == 'success' &&
      needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Must be a version that recognises Postgres 17 in config.toml's
          # db.major_version. The earlier 2.20.x pin rejected major_version=17
          # with "Failed reading config: Invalid db.major_version: 17", which
          # silently broke production migration deploys for every PR that
          # touched packages/database/supabase/migrations/** (the path filter
          # only triggers this job on actual migration changes, so the bug
          # went undetected until PR #214 — the first migration since the
          # PG17 bump — failed in 16s at the link step).
          version: 2.88.1

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run migrations
        # --include-all is required because the repo has a backlog of migrations
        # whose timestamps are earlier than the last migration on remote (this
        # happens when migrations are merged out of order, e.g. PR A merges
        # 20260409000008 while PR B already merged 20260415000001). Without
        # --include-all, Supabase CLI 2.88.1 refuses to apply older pending
        # migrations and exits 1, blocking every subsequent DB deploy.
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ─── 1b. Production migration drift gate ─────────────────────────────────────
  verify-prod-migrations:
    name: Verify Production Migrations
    needs: [changes, deploy-supabase]
    # DELIBERATELY NOT PATH-FILTERED — the path filter is the bug this catches.
    #
    # deploy-supabase only runs when migrations/** changes, so a broken migration
    # deploy stays latent until the next migration lands (see the CLI-pin comment
    # above, and REMEDIATION.md M1). QA (spec-48) replays the full ledger every
    # merge and so is always correct; production had no equivalent check. This
    # runs on every green push regardless of what changed.
    #
    # Runs even when deploy-supabase failed: the ledger comparison tells us what
    # production's schema actually is, which is the useful thing to know then.
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep in lockstep with deploy-supabase above.
          version: 2.88.1

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Compare production ledger against the repo
        # Parsing lives in a script so it is unit-testable without credentials —
        # see scripts/verify-prod-migrations.test.sh
        run: |
          set -euo pipefail
          supabase migration list --linked \
            | bash "$GITHUB_WORKSPACE/scripts/verify-prod-migrations.sh"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ─── 2. Edge Functions ───────────────────────────────────────────────────────
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: [changes, approve-production, deploy-supabase]
    if: |
      always() &&
      needs.changes.outputs.edge_functions == 'true' &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # See the version note in deploy-supabase above.
          version: 2.88.1

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── 3. Frontend (Vercel) ────────────────────────────────────────────────────
  # This job is the ONLY thing that should deploy the frontend to production.
  # It runs on every green push to main and is ordered after migrations, so app
  # code never reaches users ahead of the schema it depends on.
  #
  # REQUIRED: Vercel's Git integration must have production auto-deploy DISABLED
  # for `main` (Vercel → Project → Settings → Git → Ignored Build Step, or
  # `git.deploymentEnabled`). While it is enabled, Vercel ships every push
  # outside GitHub Actions and this ordering guarantee is void — a failed
  # migration would still be followed by a frontend deploy against the old
  # schema, with no rollback.
  deploy-vercel:
    name: Deploy to Vercel
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: always() && !failure() && !cancelled() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel
        run: npx vercel@latest --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Rollback on failure
        if: failure()
        run: |
          npx vercel@latest rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo "::error::Vercel deployment failed — rolled back to previous version"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 4. Worker (VPS) ─────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker to VPS
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() &&
      !failure() && !cancelled() &&
      needs.changes.outputs.worker == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - name: Sync repo to the tested commit
        run: |
          set -euo pipefail
          cd ~/aureon-last-mile
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard "${DEPLOY_SHA}"
          # Don't leave the token sitting in .git/config on the VPS.
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy worker
        run: bash ~/aureon-last-mile/apps/worker/scripts/deploy.sh

      - name: Report failure
        if: failure()
        run: |
          echo "::error::VPS worker deployment failed."
          echo "To debug: sudo journalctl -u aureon-worker -n 50"

  # ─── 5. Agents Suite (VPS) ───────────────────────────────────────────────────
  deploy-agents:
    name: Deploy Agents to VPS
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() &&
      !failure() && !cancelled() &&
      needs.changes.outputs.agents == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - name: Sync repo to the tested commit
        run: |
          set -euo pipefail
          cd ~/aureon-last-mile
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git reset --hard "${DEPLOY_SHA}"
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy agents
        run: bash ~/aureon-last-mile/apps/agents/scripts/deploy.sh

      - name: Report failure
        if: failure()
        run: |
          echo "::error::VPS agents deployment failed."
          echo "To debug: sudo journalctl -u aureon-agents -n 50"

  # ─── 6. OR-Tools Solver Sidecar (VPS) ────────────────────────────────────────
  deploy-solver:
    name: Deploy OR-Tools Solver to VPS
    needs: [changes, approve-production, deploy-supabase, deploy-edge-functions]
    if: |
      always() &&
      !failure() && !cancelled() &&
      needs.changes.outputs.solver == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - name: Sync repo to the tested commit
        run: |
          set -euo pipefail
          cd ~/sidecar
          git fetch origin main
          git reset --hard "${DEPLOY_SHA}"

      - name: Install dependencies and restart
        run: |
          set -euo pipefail
          cd ~/sidecar/sidecar/or-tools
          source ~/.venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          sudo cp aureon-solver.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl restart aureon-solver
          sleep 2
          curl -sf http://127.0.0.1:8090/api/v1/health

      - name: Report failure
        if: failure()
        run: |
          echo "::error::OR-Tools solver deployment failed."
          echo "To debug: sudo journalctl -u aureon-solver -n 50"

  # ─── 7. QA Environment (VPS) ─────────────────────────────────────────────────
  # Keeps the self-hosted QA env (spec-48) in sync with every green main merge.
  #
  # Deliberately NOT path-filtered on migrations: the QA script replays the
  # full migration ledger on every run (idempotent), so QA can never silently
  # drift behind the prod schema. A path filter here previously masked DB
  # failures in prod (green checks while the DB job was skipped) — QA is the
  # backstop, so it always runs. App rebuilds ARE filtered via CHANGED_* flags.
  #
  # CHANGED IN spec-57: this job is now production's precondition, not a
  # parallel mirror. `approve-production` requires it to succeed, and every
  # production job requires `approve-production` — so a QA sync failure DOES
  # block production now. That is deliberate: QA replaying the full migration
  # ledger is the only automated check that a merge's schema actually applies.
  #
  # Tradeoff accepted knowingly: a QA VPS outage blocks production deploys.
  # The escape hatch is docs/runbooks/manual-deployment.md — not editing this
  # dependency out.
  deploy-qa:
    name: Sync QA Environment
    needs: [changes]
    if: always() && !failure() && !cancelled() && needs.changes.result == 'success'
    runs-on: [self-hosted, vps]
    timeout-minutes: 15
    steps:
      # The QA checkout self-syncs inside the script, but the script FILE must
      # come from the tested commit — so check out DEPLOY_SHA into the runner
      # workspace and run it from there.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sync QA environment
        run: bash infra/supabase-qa/deploy-qa.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGED_WORKER: ${{ needs.changes.outputs.worker }}
          CHANGED_AGENTS: ${{ needs.changes.outputs.agents }}
          CHANGED_EDGE_FUNCTIONS: ${{ needs.changes.outputs.edge_functions }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::QA environment sync failed — QA is now drifted from main."
          echo "To debug: run infra/supabase-qa/deploy-qa.sh on the VPS, or check"
          echo "journalctl -u aureon-frontend-qa/-agents-qa/-worker-qa -n 50."
          echo "NOTE: this now blocks the production deploy (spec-57)."

  # ─── 7b. End-to-end tests against QA ─────────────────────────────────────────
  # Drives the real screens in the QA environment with Playwright, on the commit
  # QA was just synced to (spec-57 phase 2).
  #
  # ADVISORY FOR NOW — it reports, it does not block. `approve-production`
  # deliberately does NOT list this job in its `needs:`, and
  # scripts/check-deploy-gating.sh does not assert it. A suite that gates
  # production before its flakiness and runtime are known just trains you to
  # click through red. Make it blocking once it has a track record: add `e2e-qa`
  # to approve-production's needs, extend the guard, and drop continue-on-error.
  #
  # Must run on the VPS: every QA port binds to localhost there.
  e2e-qa:
    name: E2E against QA
    needs: [changes, deploy-qa]
    if: always() && !failure() && !cancelled() && needs.deploy-qa.result == 'success'
    runs-on: [self-hosted, vps]
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Same guard as deploy-qa.sh: a host without QA provisioned must skip
      # rather than fail, so this job never invents a reason to look red.
      - name: Check QA is provisioned
        id: qa
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f /home/aureon/.env.qa ]; then
            echo "QA env file missing — skipping E2E"
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.qa.outputs.provisioned == 'true'
        working-directory: .
        run: npm ci

      # Idempotent and cached in ~/.cache/ms-playwright. Deliberately without
      # --with-deps: that needs root, and this job must not require passwordless
      # sudo. If Chromium's system libraries are missing, run once on the VPS:
      #   sudo npx playwright install-deps chromium
      - name: Install Chromium
        if: steps.qa.outputs.provisioned == 'true'
        run: npx playwright install chromium

      - name: Run E2E against QA
        if: steps.qa.outputs.provisioned == 'true'
        run: |
          set -euo pipefail
          PGPASS="$(grep -E '^POSTGRES_PASSWORD=' /home/aureon/.env.qa | tail -n1 | cut -d= -f2- | tr -d '\r')"
          [ -n "$PGPASS" ] || { echo "::error::POSTGRES_PASSWORD missing from /home/aureon/.env.qa"; exit 1; }
          export E2E_DATABASE_URL="postgresql://postgres:${PGPASS}@localhost:5433/postgres"
          export E2E_BASE_URL="http://localhost:3200"
          npm run e2e:qa

      - name: Upload report
        if: always() && steps.qa.outputs.provisioned == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-qa-report-${{ github.event.workflow_run.head_sha }}
          path: apps/frontend/playwright-report-qa/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report failure
        if: failure()
        run: |
          echo "::error::E2E against QA failed on ${DEPLOY_SHA}."
          echo "This is ADVISORY — it does not block the production deploy."
          echo "Download the 'e2e-qa-report-*' artifact for traces and video."

  # ─── 8. Production approval gate ─────────────────────────────────────────────
  # The single human checkpoint between a green merge and production (spec-57).
  #
  # Despite sitting last in this file, it runs SECOND — right after deploy-qa.
  # Every job that mutates production depends on it, and it depends on
  # deploy-qa, so production is reachable only after QA has been synced to this
  # commit and its post-checks passed.
  #
  # `environment: production` is what makes it pause: the Production environment
  # carries a required-reviewer rule, so GitHub holds this job until a human
  # approves it under Actions → this run → "Review deployments".
  #
  # Approving deploys the SHA echoed below, NOT main's tip. The run holds the
  # `production-deploy` concurrency slot while it waits, so later merges queue
  # as separate runs, each pinned to its own DEPLOY_SHA.
  #
  # ONE job carries the environment on purpose. Spreading `environment:` across
  # all six production jobs would leave it to GitHub whether that means one
  # approval or six; this way it is unambiguously one.
  #
  # scripts/check-deploy-gating.sh fails CI if any production job stops
  # depending on this one. Do not remove that check.
  approve-production:
    name: Approve Production Deploy
    needs: [changes, deploy-qa]
    if: always() && !failure() && !cancelled() && needs.deploy-qa.result == 'success'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record what is being approved
        run: |
          echo "Commit approved for production: ${DEPLOY_SHA}"
          echo "QA sync result: ${{ needs.deploy-qa.result }}"
          echo "Verify at https://qa.aureon.tractis.ai before approving."
          echo "Runbook: docs/runbooks/approve-production-deploy.md"
