name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # The merge queue rebases each PR onto the tip of main and asks CI to run
  # against that combination before merging. Without this trigger the queue
  # waits forever on a required check that is never dispatched, so it has to
  # land on main *before* the queue is switched on.
  merge_group:

jobs:
  ci:
    name: Lint, Type-Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs before the slow jobs: a duplicate version prefix breaks every
      # deploy, and there is no point burning 6 minutes of lint/build to find out.
      - name: Check migration version prefixes are unique
        run: bash ./scripts/check-migration-versions.sh

      # The production gate is only as good as its wiring, and this file has a
      # history of gating bugs that shipped green. Fails the build if any prod
      # deploy job stops depending on approve-production (spec-57).
      - name: Check production deploy gating
        run: bash ./scripts/check-deploy-gating.sh

      - name: Test the deploy-gating guard
        run: bash ./scripts/check-deploy-gating.test.sh

      - name: Test the deploy-gating guard — concurrency groups
        run: bash ./scripts/check-deploy-gating-concurrency.test.sh

      - name: Test the deploy-gating guard — always() and path filters
        run: bash ./scripts/check-deploy-gating-always.test.sh

      - name: Test the deploy-gating guard — quarantine veto step
        run: bash ./scripts/check-deploy-gating-quarantine.test.sh

      - name: Test the deploy-gating guard — quarantine veto step (round 4)
        run: bash ./scripts/check-deploy-gating-quarantine-r4.test.sh

      - name: Test the deploy-gating guard — quarantine veto step (round 5)
        run: bash ./scripts/check-deploy-gating-quarantine-r5.test.sh

      - name: Test the deploy-gating guard — quarantine veto step (round 6)
        run: bash ./scripts/check-deploy-gating-quarantine-r6.test.sh

      # Round 7: executes candidate run: scripts under real bash against a
      # stub check-quarantine.sh, requiring an actual, live bypass before a
      # vector counts — the strategy that replaces one -rN.test.sh per round.
      - name: Test the deploy-gating guard — quarantine veto step (differential harness)
        run: bash ./scripts/check-deploy-gating-quarantine-differential.test.sh

      # A malformed quarantine.json only fails today's e2e-qa run on the VPS —
      # by then it has already re-blocked production, the exact state spec-87
      # fase 1 exists to end. Catch a bad entry (missing field, impossible
      # date, expiry renewed past the 30-day horizon) on the PR instead.
      #
      # Does NOT fail on an already-expired entry (review round 2, H3) —
      # there is no report here, so this step cannot know whether that
      # entry's test still fails, and blocking every unrelated PR over a
      # date would be the wrong failure mode. It prints a ::warning:: for
      # one instead: e2e-qa on the VPS is what actually fails once the entry
      # expires, which THIS step alone would otherwise leave invisible until
      # that next run.
      - name: Validate quarantine.json
        run: node ./scripts/check-quarantine.mjs --validate-only apps/frontend/e2e/quarantine.json

      - name: Test the quarantine guard
        run: bash ./scripts/check-quarantine.test.sh

      - name: Test the quarantine guard — input validation
        run: bash ./scripts/check-quarantine-validate.test.sh

      - name: Test the quarantine guard — report shape
        run: bash ./scripts/check-quarantine-report.test.sh

      # The watchdog is the only thing that notices QA going stale, so its
      # decision logic is unit-tested like any other guard.
      - name: Test the QA drift watchdog
        run: bash ./scripts/qa-drift-check.test.sh

      # deploy-qa.sh runs on the VPS, so nothing here executes it — but its
      # guards are unit-tested the same way. These lived under infra/ and were
      # never wired into CI, so they had never actually run on a PR.
      - name: Test the QA deploy guards
        run: |
          bash ./infra/supabase-qa/deploy-qa.guard-sudo.test.sh
          bash ./infra/supabase-qa/deploy-qa.seed.test.sh
          bash ./infra/supabase-qa/deploy-qa.drift.test.sh
          bash ./infra/supabase-qa/deploy-qa.sql-tests.test.sh
          bash ./infra/supabase-qa/deploy-qa.functions.test.sh

      # Los tokens de fase y el campo **Verify:** de un spec son leidos por
      # maquina: los hooks de .claude/hooks/ deciden si queda trabajo y
      # scripts/verify.sh decide que jueces correr. Un spec con fases pero sin
      # **Verify:** deja al runner sin criterio de termino, y un token mal
      # escrito ([in progress], [pendign]) es invisible al grep: la fase
      # desaparece de la cola sin que nadie avise. Solo valida los specs
      # tocados en este PR — los antiguos migran cuando se los toca.
      - name: Check spec fields on touched specs
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "No es un pull_request; este guard valida los specs del PR. Saltando."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || git fetch --no-tags --unshallow 2>/dev/null || true
          bash ./scripts/check-spec-fields.sh --base "$BASE"

      # Guards de scripts/: si el guard se rompe, falla en silencio.
      - name: Test the spec-fields guard
        run: bash ./scripts/check-spec-fields.test.sh

      # El harness de orquestación tiene que seguir existiendo EN EL REPO.
      # El 2026-09-07 los tres subagentes desaparecieron a mitad de sesión
      # porque vivían sólo como archivos sin trackear en un checkout viejo:
      # nada los podía recuperar y el orquestador se quedó sin a quién delegar.
      # Corre en todos los eventos, no sólo en PRs: un push directo que los
      # borre es exactamente el caso que hay que atrapar.
      - name: Check the orchestration harness is present
        run: bash ./scripts/check-harness-present.sh

      - name: Test the harness guard
        run: bash ./scripts/check-harness-present.test.sh

      - name: Lint
        run: npx turbo run lint

      - name: Type check
        run: npx turbo run type-check

      - name: Test
        run: npx turbo run test:run

      - name: Build
        run: npx turbo run build
